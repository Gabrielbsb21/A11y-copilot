[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/scanner",
    "crates/ai",
    "crates/reporters",
    "crates/cli",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "MIT"
repository = "https://github.com/Gabrielbsb21/A11y-copilot"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"

[workspace.dependencies]
a11y-core = { path = "crates/core" }
a11y-scanner = { path = "crates/scanner" }
a11y-ai = { path = "crates/ai" }
a11y-reporters = { path = "crates/reporters" }
anyhow = "1.0"
async-trait = "0.1"
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1.40", features = ["full"] }
tracing = "0.1"
